name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        run: |
          ls -la
          if [ -d "Pure-Food-Lodhran" ]; then
            cd Pure-Food-Lodhran
            echo "Inside folder"
          fi
          ls -la
          # Make wrapper with Gradle 9.1 for AGP 9.1.1
          if [ ! -f "./gradlew" ]; then
            echo "Creating gradle wrapper 9.1.0..."
            gradle wrapper --gradle-version 9.1.0
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-Lodhran-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
