name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          ls -la
          # Find real project dir
          if [ -d "Pure-Food-Lodhran" ]; then
            cd Pure-Food-Lodhran
            echo "Moved to Pure-Food-Lodhran folder"
          fi
          ls -la
          echo "Creating wrapper for AGP 9.1.1 -> needs Gradle 9.1"
          gradle wrapper --gradle-version 9.1.0
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
