name: Build Pure Food APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fix AGP Version for Compatibility
        run: |
          sed -i 's/agp = ".*"/agp = "8.2.2"/' gradle/libs.versions.toml || true
          sed -i 's/kotlin = ".*"/kotlin = "1.9.22"/' gradle/libs.versions.toml || true
          cat gradle/libs.versions.toml
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: app/build/outputs/apk/debug/*.apk
