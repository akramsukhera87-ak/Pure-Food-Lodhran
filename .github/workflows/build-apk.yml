name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix to Gradle 8.7
        run: |
          if [ -d "Pure-Food-Lodhran" ]; then cd Pure-Food-Lodhran; fi
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
          sed -i 's/9.1.1/8.2.2/g' app/build.gradle.kts || true
          sed -i 's/9.3.1/8.7/g' gradle/wrapper/gradle-wrapper.properties || true
      - name: Build APK
        run: |
          if [ -d "Pure-Food-Lodhran" ]; then cd Pure-Food-Lodhran; fi
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: '**/*.apk'
