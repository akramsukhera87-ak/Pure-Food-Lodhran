name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Fix AGP Version
        run: |
          if [ -d "Pure-Food-Lodhran" ]; then cd Pure-Food-Lodhran; fi
          # 9.1.1 ko 8.2.2 se replace karo jo stable hai
          sed -i 's/version "9.1.1"/version "8.2.2"/g' app/build.gradle.kts || true
          sed -i 's/version "9.1.1"/version "8.2.2"/g' build.gradle.kts || true
          cat app/build.gradle.kts | head -20

      - name: Build APK
        run: |
          if [ -d "Pure-Food-Lodhran" ]; then cd Pure-Food-Lodhran; fi
          chmod +x ./gradlew || gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: "**/*.apk"
