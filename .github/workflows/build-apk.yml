name: Build Pure Food APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Auto Fix Gradle Version
        run: |
          sed -i "s/gradle-.*-bin.zip/gradle-8.9-bin.zip/" gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/agp = ".*"/agp = "8.7.3"/' gradle/libs.versions.toml || true
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: app/build/outputs/apk/debug/*.apk
