name: Build Pure Food APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Fix Versions Correctly
        run: |
          sed -i 's/agp = ".*"/agp = "8.7.3"/' gradle/libs.versions.toml || true
          sed -i 's/secrets.*=.*".*"/secrets = "2.0.1"/' gradle/libs.versions.toml || true
          sed -i 's/com.google.android.libraries.mapsplatform.secrets-gradle-plugin = ".*"/com.google.android.libraries.mapsplatform.secrets-gradle-plugin = "2.0.1"/' gradle/libs.versions.toml || true
          cat gradle/libs.versions.toml
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: app/build/outputs/apk/debug/*.apk
