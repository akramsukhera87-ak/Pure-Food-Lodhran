name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Gradle Wrapper
        run: |
          ROOT="."
          if [ -d "Pure-Food-Lodhran" ]; then ROOT="Pure-Food-Lodhran"; fi
          echo "Fixing wrapper in $ROOT"
          cat > $ROOT/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i 's/9.1.1/8.2.2/g' $ROOT/app/build.gradle.kts || true
          sed -i 's/9.1.1/8.2.2/g' $ROOT/build.gradle.kts || true
          cat $ROOT/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          if [ -d "Pure-Food-Lodhran" ]; then cd Pure-Food-Lodhran; fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Food-APK
          path: '**/build/outputs/apk/debug/*.apk'
